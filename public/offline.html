<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
  :root { --paper:#f6f2ea; --ink:#1d1914; --muted:#6b6257; }
  @media (prefers-color-scheme: dark) { :root { --paper:#15130f; --ink:#f0ebe2; --muted:#a59b8d; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
         font-family: system-ui, sans-serif; padding:16px; text-align:center; }
  h1 { font-family: Georgia, serif; font-weight:600; }
  p { color:var(--muted); }
</style>
</head>
<body><div><h1>Sem conexão</h1><p>Verifique sua internet e tente de novo.</p></div></body>
</html>
